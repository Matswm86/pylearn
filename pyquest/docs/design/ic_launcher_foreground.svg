<?xml version="1.0" encoding="UTF-8"?>
<!-- PyQuest adaptive-icon foreground: Pytor flattened for 48 px.
     108x108 viewport; all art inside the 66-unit safe circle (centre 54,54, r 33).
     Background layer is solid navy #17365C (Pytor site token peri), not part of this file.
     Colours: body #3AA6DC / shade #2479B8, belly + head #F4C430 / shade #D9A21B,
     glasses frame #102742, lenses #FFFFFF at 55 %. No purple. -->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <g transform="translate(54 54) scale(0.94) translate(-54 -54)">
  <!-- lower coil -->
  <ellipse cx="54" cy="78" rx="23" ry="8.5" fill="#2479B8"/>
  <path d="M31 74.5 a23 8.5 0 0 0 46 0 v4 a23 8.5 0 0 1 -46 0z" fill="#F4C430"/>
  <path d="M33 80.5 a23 8 0 0 0 42 0 a23 8.5 0 0 1 -42 0z" fill="#D9A21B"/>
  <ellipse cx="54" cy="73" rx="23" ry="8" fill="#3AA6DC"/>
  <!-- upper coil -->
  <ellipse cx="55" cy="67.5" rx="18" ry="6.5" fill="#2479B8"/>
  <path d="M37 66 a18 6.5 0 0 0 36 0 v3.2 a18 6.5 0 0 1 -36 0z" fill="#F4C430"/>
  <ellipse cx="55" cy="65" rx="18" ry="6.2" fill="#3AA6DC"/>
  <ellipse cx="56" cy="64.4" rx="9" ry="2.8" fill="#2479B8"/>
  <!-- neck: blue back, yellow belly on the front -->
  <path d="M63 64 C66 54 66 46 60 38" fill="none" stroke="#3AA6DC" stroke-width="10" stroke-linecap="round"/>
  <path d="M59.2 63 C61.6 54 61.6 47 56.6 40" fill="none" stroke="#F4C430" stroke-width="3.6" stroke-linecap="round"/>
  <!-- head -->
  <path d="M38 34 C38 26 45 22 52 22 C60 22 65 27 64 34 C63.4 39 58 42 50 42 C43 42 38 40 38 34z" fill="#F4C430"/>
  <path d="M40 38.5 C44 41.5 56 42 62 37.5 C60 41 56 42.6 50 42.6 C45 42.6 41.5 41.2 40 38.5z" fill="#D9A21B"/>
  <!-- glasses -->
  <circle cx="45.5" cy="31" r="5" fill="#FFFFFF" fill-opacity="0.55" stroke="#102742" stroke-width="1.7"/>
  <circle cx="56.5" cy="31" r="5" fill="#FFFFFF" fill-opacity="0.55" stroke="#102742" stroke-width="1.7"/>
  <path d="M50.5 30.6 Q51 29.4 51.5 30.6" fill="none" stroke="#102742" stroke-width="1.5"/>
  <!-- eyes -->
  <circle cx="46.3" cy="31.4" r="1.8" fill="#102742"/>
  <circle cx="57.3" cy="31.4" r="1.8" fill="#102742"/>
  <circle cx="46.9" cy="30.7" r="0.6" fill="#FFFFFF"/>
  <circle cx="57.9" cy="30.7" r="0.6" fill="#FFFFFF"/>
  <!-- smile -->
  <path d="M44 37.6 Q48 39.8 52 37.8" fill="none" stroke="#102742" stroke-width="1.3" stroke-linecap="round"/>
  </g>
