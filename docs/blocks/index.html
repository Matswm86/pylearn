<script>
// ---------- Exercise data ----------
// Types: fill (drag blocks into ___ gaps), order (drag lines into order, set indent), label (drag labels onto code parts)
const SECTIONS = [
{ id:'syntax', title:'Basic syntax', intro:'Python reads top to bottom. Indentation (4 spaces) is part of the grammar, not decoration. <code>#</code> starts a comment. <code>print()</code> writes to the screen.', ex:[
 { t:'fill', title:'Your first print', goal:'Put text on the screen.', out:'Hello, Ada!',
   teach:'<p><code>print()</code> shows something on the screen. Whatever you put between the parentheses gets shown.</p><p>Text must be wrapped in quotes, <code>"like this"</code> or <code>\'like this\'</code>. The quotes tell Python "this is text, not code". Without quotes Python thinks each word is the name of a variable and crashes.</p>',
   ex:['print("Good morning")', 'Good morning'],
   code:['print(___)'], ans:[['"Hello, Ada!"',"'Hello, Ada!'"]], extra:['Hello, Ada!',"'Hello, Ada!"],
   hints:['Look at the example: the text sits inside quotes. Which block has a quote at the start AND the end?','The block that starts with " and ends with " is the only one Python accepts as text.'],
   why:'<code>print</code> is a function. The thing inside the parentheses is its argument. Quotes make it a string; without quotes Python looks for a variable named Hello and fails.' },
 { t:'fill', title:'Leave a comment', goal:'Make line 1 a note for humans so Python skips it.', out:'Runs',
   teach:'<p>A comment is a note in the code that Python ignores. It starts with the hash sign <code>#</code> and runs to the end of the line. You use comments to explain what code does.</p><p>Other languages use <code>//</code> or <code>/* */</code>. Python uses only <code>#</code>.</p>',
   ex:['# this is ignored\nprint("only this runs")', 'only this runs'],
   code:['___ This line is for humans only','print("Runs")'], ans:[['#']], extra:['//','--','/*'],
   hints:['In the example, which symbol starts the ignored line?','The hash sign, #. The others belong to other languages.'],
   why:'Everything after <code>#</code> on a line is ignored. Other languages use <code>//</code>; Python does not.' },
 { t:'order', title:'Indentation decides the block', goal:'Order the lines so "Expensive" prints only when the condition is true, and "Done" always prints.', out:'Expensive\nDone',
   teach:'<p>A line ending in a colon <code>:</code> opens a block. The lines that belong to it are pushed in by 4 spaces. That push is called indentation, and in Python it is not optional: it is how Python knows which lines are inside.</p><p>When the indentation goes back to the left edge, the block is over.</p><p>In this puzzle, use the ▸ button to push a line in, ◂ to pull it back.</p>',
   ex:['age = 20\nif age >= 18:\n    print("adult")\nprint("checked")', 'adult\nchecked'],
   lines:[['price = 120',0],['if price > 100:',0],['print("Expensive")',1],['print("Done")',0]],
   hints:['The variable must be created first. Then the if line with the colon. Which one line belongs inside the if?','Order: price, if, print("Expensive") pushed in once, print("Done") at the left edge.'],
   why:'The line indented under <code>if</code> belongs to it. The un-indented <code>print("Done")</code> is outside the if, so it always runs.' },
 { t:'fill', title:'Operators', goal:'Pick the operator that gives each result.', out:'3\n1\n8',
   teach:'<p>Python does maths with operators. The usual four: <code>+ - * /</code>. Three less familiar ones matter too:</p><p><code>//</code> divides and throws away the decimal part (7 // 2 is 3).<br><code>%</code> gives the remainder after division (7 % 2 is 1, because 2 fits three times with 1 left).<br><code>**</code> is "to the power of" (2 ** 3 is 2×2×2 = 8).</p>',
   ex:['print(9 / 2)\nprint(9 // 2)\nprint(9 % 2)\nprint(3 ** 2)', '4.5\n4\n1\n9'],
   code:['print(7 ___ 2)   # 3','print(7 ___ 2)   # 1','print(2 ___ 3)   # 8'], ans:[['//'],['%'],['**']], extra:['/','*','+'],
   hints:['Line 1 wants 3 from 7 and 2: that is division without the decimal. Line 2 wants the leftover. Line 3 wants a power.','Line 1: //. Line 2: %. Line 3: **.'],
   why:'<code>7 // 2</code> drops the decimal (3). <code>7 % 2</code> gives what is left over (1). <code>2 ** 3</code> is 2 to the power 3 (8). Plain <code>/</code> would give 3.5.' },
]},
{ id:'vars', title:'Variables & data types', intro:'A variable is a name pointing at a value. <code>=</code> assigns. Every value has a type: <code>str</code> text, <code>int</code> whole number, <code>float</code> decimal, <code>bool</code> True/False, <code>None</code> nothing. f-strings put values inside text.', ex:[
 { t:'fill', title:'Assign and inspect', goal:'Store a value under a name, then ask Python what type it is.', out:"<class 'int'>",
   teach:'<p>A variable is a name that holds a value. You create one with a single equals sign: <code>name = value</code>. Read it as "name becomes value".</p><p>Every value has a type. <code>type(x)</code> is a function that tells you the type of x. A whole number is an <code>int</code>.</p><p>Careful: <code>==</code> (two signs) means "is equal to?", a question. <code>=</code> (one sign) stores.</p>',
   ex:['city = "Bergen"\nprint(type(city))', "<class 'str'>"],
   code:['points ___ 42','print(___(points))'], ans:[['='],['type']], extra:['==','str','print'],
   hints:['Storing a value uses one equals sign. The function that reports a type is named in the example.','Line 1: =. Line 2: type.'],
   why:'One <code>=</code> assigns. Two <code>==</code> compares. <code>type()</code> returns the class of a value.' },
 { t:'fill', title:'Five types', goal:'Give each variable a value of the type written in the comment after it.', out:"MNQ 21 20.25 True None",
   teach:'<p>The five basic types:</p><p><code>str</code> text, always in quotes: <code>"MNQ"</code>. Note <code>"20"</code> in quotes is text, not a number.<br><code>int</code> whole number, no quotes: <code>20</code>.<br><code>float</code> number with a decimal point: <code>20.25</code>.<br><code>bool</code> only two values, <code>True</code> or <code>False</code>, capital first letter.<br><code>None</code> means "no value here", capital N.</p>',
   ex:['a = "hi"     # str\nb = 3        # int\nc = 3.5      # float\nd = False    # bool\ne = None     # None\nprint(a, b, c, d, e)', 'hi 3 3.5 False None'],
   code:['symbol = ___     # str','qty = ___        # int','price = ___      # float','live = ___       # bool','fill = ___       # None','print(symbol, qty + 1, price, live, fill)'],
   ans:[['"MNQ"'],['20'],['20.25'],['True'],['None']], extra:['"20"','true','null'],
   hints:['Quotes = str. No decimal point = int. Decimal point = float. Capital True = bool. None is spelled with capital N. The lowercase true and null are not Python.','"MNQ", 20, 20.25, True, None.'],
   why:'<code>"20"</code> in quotes is a string, not a number. Python spells booleans <code>True</code>/<code>False</code> with a capital, and nothing is <code>None</code>. JSON uses <code>true</code>/<code>null</code>; Python does not.' },
 { t:'fill', title:'Your first f-string', goal:'Build one sentence from two variables.', out:'MNQ trades at 20125.5',
   teach:'<p>An f-string is text with variables pasted into it. Put the letter <code>f</code> right before the opening quote, then write the variable name inside curly braces <code>{ }</code>.</p><p><code>f"Hello {name}"</code> becomes <code>Hello Ada</code> if name holds "Ada". Without the <code>f</code>, Python prints the braces literally: <code>Hello {name}</code>.</p>',
   ex:['city = "Oslo"\ntemp = 14\nprint(f"{city} is {temp} degrees")', 'Oslo is 14 degrees'],
   code:['symbol = "MNQ"','price = 20125.5','print(___"___ trades at ___")'], ans:[['f'],['{symbol}'],['{price}']], extra:['symbol','"price"','$'],
   hints:['The first gap is the single letter that goes before the quote. The other two gaps are variable names inside curly braces.','f, then {symbol}, then {price}.'],
   why:'<code>f"..."</code> is a formatted string. Anything inside <code>{ }</code> is Python code evaluated and pasted in as text. Without the <code>f</code>, the braces print literally.' },
 { t:'fill', title:'Format numbers inside f-strings', goal:'Show pnl with 2 decimals and wr as a percentage with 1 decimal.', out:'PnL: 1234.50 | Win rate: 62.3%',
   teach:'<p>Inside the braces you can add a colon and a format code to control how a number looks.</p><p><code>{x:.2f}</code> shows x with exactly 2 decimals (the f means fixed decimal).<br><code>{x:.1%}</code> multiplies by 100, adds a % sign, keeps 1 decimal.<br>The number after the dot is how many decimals you want.</p>',
   ex:['price = 3.14159\nshare = 0.5\nprint(f"{price:.1f} and {share:.0%}")', '3.1 and 50%'],
   code:['pnl = 1234.5','wr = 0.6234','print(f"PnL: {pnl___} | Win rate: {wr___}")'], ans:[[':.2f'],[':.1%']], extra:[':.2%',':d',':.1f'],
   hints:['1234.50 has 2 decimals and no % sign. 62.3% has 1 decimal and a % sign.','pnl gets :.2f. wr gets :.1%.'],
   why:'<code>{pnl:.2f}</code> means fixed-point with 2 decimals. <code>{wr:.1%}</code> multiplies by 100, adds %, keeps 1 decimal. This is how you make reports readable.' },
 { t:'order', title:'Values flow downward', goal:'Each line uses the one above it. Put them in an order that runs.', out:'HI ADA',
   teach:'<p>Python runs lines top to bottom. A variable only exists after the line that creates it has run. So if line 3 uses <code>greeting</code>, the line that creates <code>greeting</code> must come earlier.</p><p><code>.upper()</code> is a method on text: <code>"abc".upper()</code> gives <code>"ABC"</code>.</p>',
   ex:['word = "go"\nloud = word.upper()\nprint(loud)', 'GO'],
   lines:[['name = "Ada"',0],['greeting = f"Hi {name}"',0],['shout = greeting.upper()',0],['print(shout)',0]],
   hints:['Which line needs nothing? That goes first. Then find the line that uses only what already exists.','name, greeting, shout, print. Nothing is indented.'],
   why:'A variable must exist before you use it. <code>greeting</code> needs <code>name</code>; <code>shout</code> needs <code>greeting</code>.' },
]},
{ id:'collections', title:'Collections', intro:'Lists <code>[]</code> are ordered and changeable. Dicts <code>{}</code> map keys to values. Tuples <code>()</code> are ordered but frozen. Sets <code>{}</code> hold unique items only. API responses are almost always dicts and lists nested together.', ex:[
 { t:'fill', title:'A list, and picking from it', goal:'Wrap the items in list brackets, then fetch the first one.', out:"['MNQ', 'MGC', 'MES']\nMNQ",
   teach:'<p>A list holds several values in order. You write it with square brackets and commas: <code>[10, 20, 30]</code>.</p><p>You pick one item with its position in square brackets. Positions start at 0, not 1: <code>nums[0]</code> is the first item, <code>nums[1]</code> the second.</p>',
   ex:['colors = ["red", "green", "blue"]\nprint(colors[1])', 'green'],
   code:['symbols = ___"MNQ", "MGC", "MES"___','print(symbols)','print(symbols[___])'], ans:[['['],[']'],['0']], extra:['(',')','1'],
   hints:['Lists use square brackets. The first item is at position zero.','[ and ] around the items, then 0 for the first item.'],
   why:'Square brackets make a list. <code>symbols[0]</code> is the first item because Python indexes from zero. <code>symbols[1]</code> would be MGC.' },
 { t:'fill', title:'A dictionary lookup', goal:'Look up a value by its key.', out:'MNQ',
   teach:'<p>A dictionary stores pairs: a key and its value, like a real dictionary maps a word to a meaning. You write it with curly braces: <code>{"key": value}</code>.</p><p>To get a value, put the key in square brackets: <code>d["key"]</code>. Keys are usually text, so they keep their quotes. <code>d[key]</code> without quotes would look for a variable called key.</p>',
   ex:['person = {"name": "Ola", "age": 30}\nprint(person["age"])', '30'],
   code:['trade = {"symbol": "MNQ", "qty": 2}','print(trade[___])'], ans:[['"symbol"']], extra:['symbol','0','"MNQ"'],
   hints:['You want the value MNQ. Which key is it stored under? Write the key exactly as it appears in the dict, quotes included.','"symbol", with quotes.'],
   why:'A dict has no positions, only keys. <code>trade["symbol"]</code> asks for the value stored under the string key.' },
 { t:'fill', title:'Tuple and set', goal:'Make point a tuple and tags a set.', out:'(1, 2) 2',
   teach:'<p>A tuple is like a list but frozen: once made it cannot change. Round brackets: <code>(1, 2)</code>. Use it for fixed pairs like coordinates.</p><p>A set is a bag of unique items: duplicates vanish. Curly braces with no colons: <code>{"a", "b"}</code>. <code>len()</code> counts items in any collection.</p>',
   ex:['pair = (3, 4)\nletters = {"x", "y", "x"}\nprint(len(letters))', '2'],
   code:['point = ___1, 2___','tags = ___"a", "b", "a"___','print(point, len(tags))'], ans:[['('],[')'],['{'],['}']], extra:['[',']'],
   hints:['Tuples use round brackets, sets use curly braces. The output 2 shows the duplicate "a" was dropped, which only a set does.','( ) around 1, 2 and { } around the strings.'],
   why:'<code>(1, 2)</code> cannot be changed after creation. <code>{"a","b","a"}</code> keeps one "a", so <code>len</code> is 2.' },
 { t:'order', title:'Build a list step by step', goal:'Start empty, add two prices in order, print.', out:'[100, 105]',
   teach:'<p><code>[]</code> is an empty list. <code>mylist.append(x)</code> adds x to the end. The list must exist before you can append to it, and the order you append is the order you get.</p>',
   ex:['names = []\nnames.append("a")\nnames.append("b")\nprint(names)', "['a', 'b']"],
   lines:[['prices = []',0],['prices.append(100)',0],['prices.append(105)',0],['print(prices)',0]],
   hints:['Create the empty list first. The output shows 100 before 105, so which append comes first?','prices = [], append(100), append(105), print.'],
   why:'<code>.append()</code> adds to the end. Appending 100 then 105 gives <code>[100, 105]</code>.' },
 { t:'fill', title:'Loop over a dict', goal:'Walk through every key/value pair.', out:'symbol -> MNQ\nqty -> 2',
   teach:'<p>A <code>for</code> loop repeats its indented body once per item. To loop over a dictionary\'s pairs, call <code>.items()</code> on it. Each round gives you two names: the key and the value.</p><p><code>.keys()</code> would give only keys, <code>.values()</code> only values.</p>',
   ex:['ages = {"Ola": 30, "Kari": 28}\nfor name, age in ages.items():\n    print(name, age)', 'Ola 30\nKari 28'],
   code:['trade = {"symbol": "MNQ", "qty": 2}','for key, value in trade___():','    print(f"{key} -> {value}")'], ans:[['.items']], extra:['.keys','.values','.pairs'],
   hints:['The loop names two things, key and value. Which method gives both at once?','.items'],
   why:'<code>.items()</code> yields (key, value) pairs. This loop is how you inspect any API response.' },
]},
{ id:'flow', title:'Control flow', intro:'<code>if / elif / else</code> pick a branch. <code>for</code> repeats over a collection. <code>while</code> repeats until a condition turns false. <code>break</code> leaves the loop, <code>continue</code> skips to the next round.', ex:[
 { t:'fill', title:'Three branches', goal:'Complete the chain: if, else-if, else.', out:'Flat',
   teach:'<p><code>if</code> checks a condition. <code>elif</code> ("else if") checks another one only if the first was false. <code>else</code> catches everything left over and has no condition. Only one branch runs.</p>',
   ex:['temp = 5\nif temp > 20:\n    print("warm")\nelif temp > 0:\n    print("cool")\nelse:\n    print("freezing")', 'cool'],
   code:['pnl = 0','if pnl > 0:','    print("Green")','___ pnl == 0:','    print("Flat")','___:','    print("Red")'], ans:[['elif'],['else']], extra:['else if','elseif','then'],
   hints:['Python writes "else if" as one short word. The final catch-all has no condition.','elif, then else.'],
   why:'<code>elif</code> is Python\'s "else if". <code>else</code> takes no condition. Only the first true branch runs.' },
 { t:'order', title:'A for loop with a body', goal:'Print each symbol, then print done once.', out:'MNQ\nMGC\ndone',
   teach:'<p><code>for s in symbols:</code> runs the indented lines once for each item, with <code>s</code> holding the current item. A line at the left edge after the loop runs once, after the loop is finished.</p>',
   ex:['for n in [1, 2]:\n    print(n)\nprint("end")', '1\n2\nend'],
   lines:[['symbols = ["MNQ", "MGC"]',0],['for s in symbols:',0],['print(s)',1],['print("done")',0]],
   hints:['The list must exist before the loop. Only the line that repeats goes inside (indented).','symbols, for, print(s) indented once, print("done") at the edge.'],
   why:'The indented line runs once per item. The un-indented <code>print("done")</code> runs after the loop finishes.' },
 { t:'fill', title:'Count down with while', goal:'Loop while n is above zero, printing and shrinking n each round.', out:'3\n2\n1',
   teach:'<p><code>while condition:</code> repeats its body as long as the condition is true. Something inside must change the condition or the loop never ends.</p><p><code>n -= 1</code> is shorthand for <code>n = n - 1</code>. <code>n += 1</code> adds one.</p>',
   ex:['n = 0\nwhile n < 2:\n    print(n)\n    n += 1', '0\n1'],
   code:['n = 3','while n ___ 0:','    print(n)','    n ___ 1'], ans:[['>'],['-=']], extra:['<','=-','+='],
   hints:['n starts at 3 and must keep going while it is bigger than 0. Each round n must get smaller.','> and -=.'],
   why:'<code>while</code> re-checks the condition every round. <code>n -= 1</code> shrinks n. Forget it and the loop never ends.' },
 { t:'fill', title:'break and continue', goal:'Skip even numbers, stop once n passes 7.', out:'1\n3\n5\n7',
   teach:'<p>Two words control a loop from inside.</p><p><code>continue</code> skips the rest of this round and jumps to the next item.<br><code>break</code> stops the whole loop immediately.</p><p><code>range(10)</code> gives 0,1,2,...,9. <code>n % 2 == 0</code> is true for even numbers.</p>',
   ex:['for n in range(5):\n    if n == 1:\n        continue\n    if n == 3:\n        break\n    print(n)', '0\n2'],
   code:['for n in range(10):','    if n % 2 == 0:','        ___','    if n > 7:','        ___','    print(n)'], ans:[['continue'],['break']], extra:['pass','stop','skip'],
   hints:['Even numbers should be skipped, not stop the loop. Passing 7 should end everything.','continue for the even check, break for n > 7.'],
   why:'<code>continue</code> jumps to the next n without printing. <code>break</code> exits the whole loop at n = 9.' },
 { t:'order', title:'Nested indentation', goal:'An if inside a for. Two levels of indent.', out:'big: 150\nbig: 200\nend',
   teach:'<p>Blocks can sit inside blocks. Each colon opens a new level, and each level is pushed in by 4 more spaces. An <code>if</code> inside a <code>for</code> is indented once; the line inside that <code>if</code> is indented twice.</p>',
   ex:['for x in [1, 5]:\n    if x > 3:\n        print("large")\nprint("done")', 'large\ndone'],
   lines:[['for p in [50, 150, 200]:',0],['if p > 100:',1],['print(f"big: {p}")',2],['print("end")',0]],
   hints:['for at the edge. The if is inside the for (one push). The print is inside the if (two pushes). "end" is outside everything.','Indents: 0, 1, 2, 0 in that order.'],
   why:'Each colon opens a block, and each block indents one more level. <code>print("end")</code> at level 0 is outside both.' },
]},
{ id:'functions', title:'Functions', intro:'<code>def</code> defines a function. The names in the parentheses are <b>parameters</b> (placeholders). The values you pass when calling are <b>arguments</b>. <code>return</code> sends a value back to the caller.', ex:[
 { t:'fill', title:'Define, return, call', goal:'Write a function that takes a name and returns a greeting, then call it.', out:'Hi Ada',
   teach:'<p>A function is a named, reusable block of code. <code>def greet(name):</code> defines one called greet. The <code>name</code> in the parentheses is a <b>parameter</b>: a placeholder for whatever value comes in.</p><p><code>return</code> sends a result back out. Calling <code>greet("Ada")</code> runs the function with name = "Ada". That "Ada" is the <b>argument</b>: the real value you pass.</p><p>Parameter = the slot. Argument = what you put in the slot.</p>',
   ex:['def double(x):\n    return x * 2\n\nprint(double(21))', '42'],
   code:['___ greet(name):','    ___ f"Hi {name}"','print(greet(___))'], ans:[['def'],['return'],['"Ada"']], extra:['function','print','name'],
   hints:['Line 1 starts a definition. Line 2 sends the result out. Line 3 passes a real value in, and it is text.','def, return, "Ada" with quotes.'],
   why:'<code>name</code> is the parameter. <code>"Ada"</code> is the argument. <code>return</code> hands the result to <code>print</code>.' },
 { t:'label', title:'Name the parts', goal:'Drag each label onto the matching part of the code.',
   teach:'<p>Read the code below in two halves. The <code>def</code> line is the <b>definition</b>: its name, its parameters, and any default values (<code>pct=0.01</code> means "if nobody gives pct, use 0.01").</p><p>The last line is the <b>call</b>: the function name followed by arguments. <code>50000</code> is a positional argument (matched by position to balance). <code>pct=0.02</code> is a keyword argument (matched by name).</p>',
   ex:['def area(w, h=1):\n    return w * h\n\nprint(area(4, h=3))', '12'],
   code:'def [[fname|risk]]([[param|balance]], [[default|pct=0.01]]):\n    [[ret|return balance * pct]]\n\nloss = [[call|risk]]([[arg|50000]], [[kwarg|pct=0.02]])',
   labels:[{k:'fname',t:'function name'},{k:'param',t:'parameter'},{k:'default',t:'default argument'},{k:'ret',t:'return statement'},{k:'call',t:'function call'},{k:'arg',t:'positional argument'},{k:'kwarg',t:'keyword argument'}], extra:['import','method'],
   hints:['Things on the def line are about defining. Things on the loss = line are about calling. name=value in a call is a keyword argument.','Line 1: function name, parameter, default argument. Line 2: return statement. Line 4: function call, positional argument, keyword argument.'],
   why:'<code>balance</code> and <code>pct</code> are parameters. <code>50000</code> is passed by position, <code>pct=0.02</code> by keyword. The default is used only when the caller leaves pct out.' },
 { t:'fill', title:'Default arguments', goal:'Give risk a default of 0.01, call once with the default and once overriding it.', out:'500.0\n1000.0',
   teach:'<p>A parameter can have a default: <code>def f(a, b=5):</code>. Now <code>f(1)</code> uses b = 5, and <code>f(1, 9)</code> uses b = 9. Defaults make the common case short.</p><p>Do the maths: 50000 × 0.01 = 500.0.</p>',
   ex:['def total(price, tax=0.25):\n    return price * (1 + tax)\n\nprint(total(100))\nprint(total(100, 0.0))', '125.0\n100.0'],
   code:['def size(balance, risk=___):','    return balance * risk','print(size(50000))','print(size(50000, ___))'], ans:[['0.01'],['0.02']], extra:['0.1','1','risk'],
   hints:['50000 times what gives 500.0? That is the default. 50000 times what gives 1000.0? That is the override.','0.01 then 0.02.'],
   why:'<code>size(50000)</code> uses the default, 50000 × 0.01 = 500.0. <code>size(50000, 0.02)</code> overrides it.' },
 { t:'fill', title:'return, not print', goal:'Make add give its result back so total can hold it.', out:'5',
   teach:'<p><code>print</code> shows a value on screen and then it is gone. <code>return</code> hands the value back to whoever called the function, so it can be stored in a variable or used further.</p><p>A function with no return gives back <code>None</code>. So <code>total = add(2, 3)</code> only works if add returns.</p>',
   ex:['def square(n):\n    return n * n\n\nresult = square(4)\nprint(result + 1)', '17'],
   code:['def add(a, b):','    ___ a + b','total = add(2, 3)','print(total)'], ans:[['return']], extra:['print','yield','give'],
   hints:['Line 3 stores the result in total. For that to work, the function must send the value back, not just show it.','return'],
   why:'If the function only printed, <code>total</code> would be <code>None</code>. <code>return</code> makes a function usable as a value.' },
 { t:'order', title:'Define before you call', goal:'Python must have seen the def before the call runs.', out:'MNQ: 2 contracts',
   teach:'<p>The def and its indented body come first. The call comes after, at the left edge. Arguments fill parameters left to right: in <code>show("MNQ", 2)</code>, symbol becomes "MNQ" and qty becomes 2.</p>',
   ex:['def hello(who):\n    print(f"hello {who}")\n\nhello("world")', 'hello world'],
   lines:[['def show(symbol, qty):',0],['print(f"{symbol}: {qty} contracts")',1],['show("MNQ", 2)',0]],
   hints:['def first, its body pushed in, then the call at the edge.','def (0), print (1), show (0).'],
   why:'The body is indented under def. The call at level 0 comes after.' },
]},
{ id:'imports', title:'Imports & packages', intro:'<code>import x</code> loads a module; you then write <code>x.thing</code>. <code>from x import thing</code> loads just that name. <code>pip install</code> runs in the terminal, not in Python, and fetches packages that are not built in.', ex:[
 { t:'fill', title:'import a module', goal:'Load the math module, then use a function from it.', out:'4.0',
   teach:'<p>A module is a file of ready-made code. <code>import math</code> loads the built-in math module. After that you reach its contents with a dot: <code>math.sqrt(16)</code> means "the sqrt function inside math".</p>',
   ex:['import random\nprint(random.choice(["a", "a", "a"]))', 'a'],
   code:['___ math','print(math.___(16))'], ans:[['import'],['sqrt']], extra:['include','require','root'],
   hints:['The keyword that loads a module is in the example. sqrt is short for square root.','import, then sqrt.'],
   why:'After <code>import math</code> everything inside lives under the <code>math.</code> prefix.' },
 { t:'fill', title:'from ... import ...', goal:'Pull sqrt directly into your file so you can call it without the prefix.', out:'4.0',
   teach:'<p><code>from math import sqrt</code> copies just one name out of the module. Now you write <code>sqrt(16)</code> with no <code>math.</code> in front. The trade-off: <code>math.pi</code> is not available, because you never imported math itself.</p>',
   ex:['from random import choice\nprint(choice(["b"]))', 'b'],
   code:['from math ___ sqrt','print(___(16))'], ans:[['import'],['sqrt']], extra:['math.sqrt','get','load'],
   hints:['The pattern is from X import Y. After that, Y is used bare, no prefix.','import, then sqrt (not math.sqrt).'],
   why:'<code>from math import sqrt</code> copies one name. Now <code>sqrt(16)</code> works and <code>math.sqrt</code> would fail.' },
 { t:'fill', title:'Aliases', goal:'Give a long module a short nickname.', out:'2.3.0',
   teach:'<p><code>import pandas as pd</code> loads pandas but lets you call it <code>pd</code>. It only changes the name you type. You will see <code>as pd</code> and <code>as np</code> (numpy) in almost every data script.</p>',
   ex:['import datetime as dt\nprint(dt.date(2026, 9, 7).year)', '2026'],
   code:['import pandas ___ pd','print(pd.__version__)'], ans:[['as']], extra:['alias','=','->'],
   hints:['A two-letter keyword between the module and its nickname.','as'],
   why:'<code>as pd</code> is convention for pandas. It only changes the name you type.' },
 { t:'fill', title:'Installing a package', goal:'This is a terminal command, not Python. Install the requests library.', out:'Successfully installed certifi charset-normalizer idna requests urllib3 (versions vary)',
   teach:'<p>Modules like math come with Python. Others, like requests or openai, must be downloaded first. The tool for that is <code>pip</code>, and you run it in the terminal, not inside a .py file:</p><p><code>pip install openai</code></p><p>After that, <code>import openai</code> works in your Python code.</p>',
   ex:['pip install numpy', 'Successfully installed numpy-2.1.0'],
   code:['___ install requests'], ans:[['pip']], extra:['import','python','apt'],
   hints:['The Python package installer, three letters, shown in the example.','pip'],
   why:'<code>pip</code> downloads packages from PyPI. Install name and import name usually match but not always.' },
 { t:'order', title:'Import, then use', goal:'Imports go at the top. Nothing can use json before it is imported.', out:'{"qty": 2}',
   teach:'<p>Convention and necessity agree: all imports go at the top of the file. A line that uses <code>json.dumps</code> will crash if the import has not run yet. <code>json.dumps(d)</code> turns a dict into JSON text.</p>',
   ex:['import math\nprint(math.floor(2.7))', '2'],
   lines:[['import json',0],['trade = {"qty": 2}',0],['text = json.dumps(trade)',0],['print(text)',0]],
   hints:['Import first. Then create the dict. Then convert it. Then print the converted text.','import, trade, text, print.'],
   why:'<code>json.dumps</code> turns a dict into a JSON string. The import must run first.' },
]},
{ id:'classes', title:'Simple classes', intro:'A class is a blueprint. An object is one thing built from it. <code>__init__</code> runs when you build one. <code>self</code> is the object itself. Methods are functions that live on the class.', ex:[
 { t:'fill', title:'Blueprint and constructor', goal:'Define a Bot class whose constructor stores the name on the object.', out:'Drift',
   teach:'<p>A class is a blueprint for objects. <code>class Bot:</code> starts one.</p><p>Inside, <code>def __init__(self, name):</code> is the constructor: the function that runs when you build an object with <code>Bot("Drift")</code>. Two underscores each side of init.</p><p><code>self</code> means "this particular object". <code>self.name = name</code> saves the incoming name onto the object, so later <code>bot.name</code> gives it back.</p>',
   ex:['class Dog:\n    def __init__(self, sound):\n        self.sound = sound\n\nrex = Dog("woof")\nprint(rex.sound)', 'woof'],
   code:['___ Bot:','    def ___(self, name):','        ___.name = name','','bot = Bot("Drift")','print(bot.name)'], ans:[['class'],['__init__'],['self']], extra:['def','init','this'],
   hints:['Line 1 opens a blueprint. Line 2 is the constructor with underscores. Line 3 stores onto "this object".','class, __init__, self.'],
   why:'<code>Bot("Drift")</code> calls <code>__init__</code> with self = the new object and name = "Drift".' },
 { t:'fill', title:'A method', goal:'Add a method that uses the stored name, then call it on the object.', out:'I am Drift',
   teach:'<p>A method is a function defined inside a class. Its first parameter is always <code>self</code>, so it can reach the object\'s data (<code>self.name</code>).</p><p>You call it with a dot on the object: <code>bot.hello()</code>. You do not pass self yourself; Python fills it in with bot.</p>',
   ex:['class Dog:\n    def __init__(self, sound):\n        self.sound = sound\n    def speak(self):\n        return self.sound * 2\n\nrex = Dog("woof")\nprint(rex.speak())', 'woofwoof'],
   code:['class Bot:','    def __init__(self, name):','        self.name = name','    def hello(___):','        return f"I am {self.name}"','','bot = Bot("Drift")','print(bot.___())'], ans:[['self'],['hello']], extra:['name','bot','this'],
   hints:['Every method starts with the same first parameter. The last line calls the method by its name after the dot.','self, then hello.'],
   why:'<code>bot.hello()</code> means "call hello with self = bot". That is why <code>self.name</code> knows which bot it is.' },
 { t:'label', title:'Name the parts', goal:'Drag each label onto the matching part.',
   teach:'<p>Vocabulary check. <b>class</b>: the blueprint keyword. <b>constructor</b>: <code>__init__</code>. <b>self</b>: the object being built. <b>attribute</b>: data stored on the object (<code>self.balance</code>). <b>object</b> (or instance): one thing built from the class, here <code>acct</code>. <b>attribute access</b>: reading data off an object with a dot.</p>',
   ex:['class Car:\n    def __init__(self, km):\n        self.km = km\n\nmine = Car(120000)\nprint(mine.km)', '120000'],
   code:'[[cls|class]] Account:\n    def [[init|__init__]]([[self|self]], balance):\n        [[attr|self.balance]] = balance\n\n[[obj|acct]] = Account(50000)\nprint([[mcall|acct.balance]])',
   labels:[{k:'cls',t:'class keyword'},{k:'init',t:'constructor'},{k:'self',t:'self'},{k:'attr',t:'attribute'},{k:'obj',t:'object (instance)'},{k:'mcall',t:'attribute access'}], extra:['parameter','import'],
   hints:['The name on the left of = after the class block is the object. Reading .balance off it is attribute access.','class keyword, constructor, self, attribute, object, attribute access, top to bottom.'],
   why:'<code>Account</code> is the class, <code>acct</code> is one object. In the OpenAI snippet, <code>client = OpenAI()</code> is exactly this.' },
 { t:'order', title:'Class, then object, then use', goal:'Order so the class exists before you build from it.', out:'MNQ',
   teach:'<p>Inside a class, the def is indented once and the def\'s body twice. After the class block ends (back at the left edge), you can build an object and read its attribute.</p>',
   ex:['class Cat:\n    def __init__(self, n):\n        self.n = n\n\nc = Cat(9)\nprint(c.n)', '9'],
   lines:[['class Trade:',0],['def __init__(self, symbol):',1],['self.symbol = symbol',2],['t = Trade("MNQ")',0],['print(t.symbol)',0]],
   hints:['class at the edge, def pushed in once, self.symbol pushed in twice, then the two using lines at the edge.','Indents 0, 1, 2, 0, 0.'],
   why:'The class body is indented once, the method body twice. Only after the class is complete can <code>Trade("MNQ")</code> build an object.' },
]},
{ id:'oop', title:'Classes, deeper', intro:'Inheritance lets one class reuse another: <code>class Dog(Animal):</code> gets everything Animal has. <code>super()</code> reaches the parent. A child can replace a parent method with its own (override), so one call gives different behaviour per class: that is polymorphism. Magic methods like <code>__str__</code> and <code>__len__</code> plug your class into <code>print()</code> and <code>len()</code>.', ex:[
 { t:'fill', title:'Inherit from a parent', goal:'Make Dog a child of Animal, then call a method Dog never defined itself.', out:'Rex is an animal',
   teach:'<p>Inheritance means "this class is a kind of that class". Write the parent in brackets after the class name: <code>class Dog(Animal):</code>. Dog now has every method Animal has, without writing them again.</p><p><code>pass</code> means "nothing more to add here". It keeps an empty block legal.</p>',
   ex:['class Vehicle:\n    def wheels(self):\n        return 4\n\nclass Car(Vehicle):\n    pass\n\nprint(Car().wheels())', '4'],
   code:['class Animal:','    def __init__(self, name):','        self.name = name','    def describe(self):','        return f"{self.name} is an animal"','','class Dog(___):','    pass','','rex = Dog("Rex")','print(rex.___())'], ans:[['Animal'],['describe']], extra:['Dog','self','name'],
   hints:['The brackets after class Dog name the parent class. The last line calls the one method Animal defines besides __init__.','Animal, then describe.'],
   why:'<code>Dog</code> has no methods of its own, so Python looks one step up, in <code>Animal</code>, and finds both <code>__init__</code> and <code>describe</code>.' },
 { t:'fill', title:'Override: same call, different answer', goal:'Give Cat its own sound, then call sound on every pet in the loop.', out:'Meow\nMoo\n...',
   teach:'<p>A child class can define a method with the same name as the parent. The child version wins for objects of that class. This is called overriding.</p><p>The payoff is polymorphism: one line, <code>pet.sound()</code>, works on many classes and each one answers in its own way. The loop does not need to know which class each pet is.</p>',
   ex:['class Shape:\n    def name(self):\n        return "shape"\n\nclass Circle(Shape):\n    def name(self):\n        return "circle"\n\nfor s in [Circle(), Shape()]:\n    print(s.name())', 'circle\nshape'],
   code:['class Animal:','    def sound(self):','        return "..."','class Cat(Animal):','    def ___(self):','        return "Meow"','class Cow(Animal):','    def sound(self):','        return "Moo"','','for pet in [Cat(), Cow(), Animal()]:','    print(pet.___())'], ans:[['sound'],['sound']], extra:['meow','speak','Animal'],
   hints:['To override, the child method must have exactly the same name as the parent method. The loop calls that same name.','sound in both gaps.'],
   why:'<code>Cat.sound</code> replaces <code>Animal.sound</code> for cats. A plain <code>Animal()</code> still uses the parent version, so it prints <code>...</code>.' },
 { t:'fill', title:'super() runs the parent first', goal:'Let the parent store owner, then the child adds rate.', out:'Kari 0.03',
   teach:'<p>When a child writes its own <code>__init__</code>, the parent <code>__init__</code> no longer runs by itself. <code>super().__init__(owner)</code> calls it on purpose, so the parent can do its part (store owner) before the child adds its own data.</p><p><code>super()</code> means "my parent class". You do not pass <code>self</code> to it; Python fills that in.</p>',
   ex:['class Person:\n    def __init__(self, name):\n        self.name = name\n\nclass Student(Person):\n    def __init__(self, name, school):\n        super().__init__(name)\n        self.school = school\n\ns = Student("Ola", "UiO")\nprint(s.name, s.school)', 'Ola UiO'],
   code:['class Account:','    def __init__(self, owner):','        self.owner = owner','','class Savings(Account):','    def __init__(self, owner, rate):','        ___().__init__(owner)','        self.rate = rate','','s = Savings("Kari", 0.03)','print(s.owner, s.___)'], ans:[['super'],['rate']], extra:['parent','this','owner'],
   hints:['The built-in that means "my parent class" has five letters. The last gap reads the attribute the child stored itself.','super, then rate.'],
   why:'Without <code>super().__init__(owner)</code> the line <code>self.owner = owner</code> never runs and <code>s.owner</code> raises AttributeError.' },
 { t:'fill', title:'isinstance checks the family', goal:'Ask whether rex is a Dog, and whether it also counts as an Animal.', out:'True\nTrue\nFalse',
   teach:'<p><code>isinstance(obj, SomeClass)</code> answers True or False: is this object built from that class, or from a child of it?</p><p>A Dog is also an Animal, because Dog inherits from Animal. A plain string is neither.</p>',
   ex:['class Vehicle: pass\nclass Car(Vehicle): pass\n\nprint(isinstance(Car(), Vehicle))\nprint(isinstance(5, Car))', 'True\nFalse'],
   code:['class Animal: pass','class Dog(Animal): pass','','rex = Dog()','print(___(rex, Dog))','print(isinstance(rex, ___))','print(isinstance("Rex", Animal))'], ans:[['isinstance'],['Animal']], extra:['type','Cat','is'],
   hints:['The function name is in the lesson. The second line must print True for a class that is not Dog itself.','isinstance, then Animal.'],
   why:'<code>isinstance</code> follows inheritance upward, so a Dog passes the Animal test. <code>type(rex) == Animal</code> would say False.' },
 { t:'fill', title:'__str__ decides what print shows', goal:'Make print(p) show (3, 4) instead of an ugly memory address.', out:'(3, 4)',
   teach:'<p>Print an object of your own class and you get something like <code>&lt;Point object at 0x7f...&gt;</code>. Add a method called <code>__str__</code> that returns text, and <code>print()</code> uses that text instead.</p><p>Names with two underscores on each side are magic methods: Python calls them for you at the right moment.</p>',
   ex:['class Song:\n    def __init__(self, title):\n        self.title = title\n    def __str__(self):\n        return f"Song: {self.title}"\n\nprint(Song("Take On Me"))', 'Song: Take On Me'],
   code:['class Point:','    def __init__(self, x, y):','        self.x = x','        self.y = y','    def ___(self):','        return f"({self.x}, {self.y})"','','p = Point(3, 4)','print(p)'], ans:[['__str__']], extra:['__init__','str','__print__'],
   hints:['The method is a magic method, so it has two underscores on both sides, and its name is the short name of the string type.','__str__'],
   why:'<code>print(p)</code> calls <code>str(p)</code>, which calls <code>p.__str__()</code>. There is no <code>__print__</code>.' },
 { t:'fill', title:'__len__ makes len() work', goal:'Let len() count the songs in a Playlist.', out:'3',
   teach:'<p><code>len(x)</code> works on lists and strings because they have a <code>__len__</code> method. Give your own class one, return a whole number, and <code>len()</code> works on your objects too.</p>',
   ex:['class Team:\n    def __init__(self, members):\n        self.members = members\n    def __len__(self):\n        return len(self.members)\n\nprint(len(Team(["a", "b"])))', '2'],
   code:['class Playlist:','    def __init__(self, songs):','        self.songs = songs','    def __len__(self):','        return ___(self.songs)','','mix = Playlist(["a", "b", "c"])','print(___(mix))'], ans:[['len'],['len']], extra:['count','size','.length'],
   hints:['Inside, count the list stored on the object. Outside, call the same built-in on the playlist itself.','len in both gaps.'],
   why:'<code>len(mix)</code> calls <code>mix.__len__()</code>, which returns <code>len(self.songs)</code>. Python has no <code>.length</code>.' },
 { t:'fill', title:'Class variable versus instance variable', goal:'Count how many Counter objects were made, using one number shared by all of them.', out:'3',
   teach:'<p>A variable written directly inside the class body, like <code>count = 0</code>, is a class variable: one value shared by every object. A variable set with <code>self.x = ...</code> is an instance variable: each object has its own.</p><p>Trap: <code>self.count += 1</code> makes a new private count on that one object and leaves the shared one at 0. To change the shared value, go through the class name.</p>',
   ex:['class Player:\n    team = "Vikings"\n    def __init__(self, name):\n        self.name = name\n\na = Player("Ola")\nb = Player("Kari")\nprint(a.name, b.name, a.team, b.team)', 'Ola Kari Vikings Vikings'],
   code:['class Counter:','    count = 0','    def __init__(self):','        ___.count += 1','','Counter()','Counter()','Counter()','print(Counter.count)'], ans:[['Counter']], extra:['self','count','0'],
   hints:['The number must be shared, so it is changed through the class, not through one object.','Counter'],
   why:'<code>Counter.count += 1</code> updates the one shared number. With <code>self.count</code> each object would get its own copy and <code>Counter.count</code> would stay 0.' },
 { t:'fill', title:'Encapsulation: guard the inside', goal:'Keep the balance inside the object and only change it through deposit, which refuses negative amounts.', out:'50',
   teach:'<p>Encapsulation means an object guards its own data. Outside code should use the methods, which can check the input, instead of changing the data directly.</p><p>Python marks "inside use only" with a leading underscore: <code>self._balance</code>. Python does not block access; the underscore is a strong hint to other programmers.</p>',
   ex:['class Thermostat:\n    def __init__(self):\n        self._temp = 20\n    def set(self, t):\n        if 5 <= t <= 30:\n            self._temp = t\n    def temp(self):\n        return self._temp\n\nh = Thermostat()\nh.set(99)\nprint(h.temp())', '20'],
   code:['class Wallet:','    def __init__(self):','        self.___ = 0','    def deposit(self, amount):','        if amount > 0:','            self._balance += amount','    def balance(self):','        return self._balance','','w = Wallet()','w.deposit(50)','w.deposit(-999)','print(w.___())'], ans:[['_balance'],['balance']], extra:['amount','__init__','deposit'],
   hints:['Gap 1 must be the same underscore name the other methods use. Gap 2 is the method that reads it.','_balance, then balance.'],
   why:'The -999 deposit is refused by the check inside <code>deposit</code>, so the balance stays 50. Outside code never touched <code>_balance</code>.' },
 { t:'order', title:'Parent before child', goal:'The parent class must exist before a child can inherit from it.', out:'Rex says woof',
   teach:'<p>Python reads the file top to bottom. <code>class Dog(Animal):</code> needs Animal to exist already, so the whole Animal block comes first. Each method is indented once inside its class, and each method body twice.</p>',
   ex:['class A:\n    def hi(self):\n        return "hi"\n\nclass B(A):\n    pass\n\nprint(B().hi())', 'hi'],
   lines:[['class Animal:',0],['def __init__(self, name):',1],['self.name = name',2],['class Dog(Animal):',0],['def speak(self):',1],['return f"{self.name} says woof"',2],['print(Dog("Rex").speak())',0]],
   hints:['Animal block (3 lines) first, then the Dog block (3 lines), then the print at the edge.','Indents: 0, 1, 2, 0, 1, 2, 0.'],
   why:'<code>Dog</code> did not define <code>__init__</code>, so <code>Dog("Rex")</code> uses the one from Animal, which stores name.' },
 { t:'label', title:'Name the parts', goal:'Drag each label onto the matching part of the inheritance code.',
   teach:'<p>Vocabulary for this topic. <b>parent class</b>: the class in the brackets. <b>call the parent</b>: <code>super().__init__(...)</code>. <b>overridden method</b>: a method the child redefines. <b>method call</b>: a dot and brackets on an object.</p>',
   ex:['class Cat(Animal):\n    def sound(self):\n        return "Meow"', ''],
   code:'[[cls|class]] Dog([[parent|Animal]]):\n    def [[init|__init__]](self, name):\n        [[sup|super().__init__(name)]]\n    def [[over|speak]](self):\n        return "Woof"\n\n[[obj|rex]] = Dog("Rex")\nprint([[call|rex.speak()]])',
   labels:[{k:'cls',t:'class keyword'},{k:'parent',t:'parent class'},{k:'init',t:'constructor'},{k:'sup',t:'call the parent'},{k:'over',t:'overridden method'},{k:'obj',t:'object (instance)'},{k:'call',t:'method call'}], extra:['attribute','import'],
   hints:['The name inside the brackets on line 1 is the parent. The line with super() calls the parent. speak replaces a method Animal also has.','class keyword, parent class, constructor, call the parent, overridden method, object, method call.'],
   why:'Every class you meet in a library (Django views, PyTorch models) uses exactly these parts: a parent in brackets, <code>super().__init__</code>, and overridden methods.' },
 { t:'fill', title:'A method calls another method', goal:'Make report use total() through self.', out:'Total: 15',
   teach:'<p>Inside a class, one method can call another method of the same object. Go through <code>self</code>: <code>self.total()</code>. Writing just <code>total()</code> fails, because there is no plain function called total.</p>',
   ex:['class Timer:\n    def __init__(self, s):\n        self.s = s\n    def minutes(self):\n        return self.s // 60\n    def label(self):\n        return f"{self.minutes()} min"\n\nprint(Timer(300).label())', '5 min'],
   code:['class Cart:','    def __init__(self):','        self.items = []','    def add(self, price):','        self.items.append(price)','    def total(self):','        return sum(self.items)','    def report(self):','        return f"Total: {___.total()}"','','c = Cart()','c.add(10)','c.add(5)','print(c.___())'], ans:[['self'],['report']], extra:['Cart','c','total()'],
   hints:['Inside the class, the object is always reached through one name. The last line calls the method that builds the text.','self, then report.'],
   why:'<code>self.total()</code> runs total on the same cart. <code>sum([10, 5])</code> is 15.' },
 { t:'order', title:'Build, change, read', goal:'Make a lamp, print it, switch it on, print again.', out:'before: False\nafter: True',
   teach:'<p>An object keeps its data between lines. Build it, read an attribute, change the attribute, read it again: the second read sees the change.</p>',
   ex:['class Box:\n    def __init__(self):\n        self.full = False\n\nb = Box()\nb.full = True\nprint(b.full)', 'True'],
   lines:[['class Lamp:',0],['def __init__(self):',1],['self.on = False',2],['lamp = Lamp()',0],['print(f"before: {lamp.on}")',0],['lamp.on = True',0],['print(f"after: {lamp.on}")',0]],
   hints:['Class block first. The object must exist before anything reads it. "before" must print before the change.','class, def, self.on, lamp =, before, lamp.on = True, after.'],
   why:'<code>lamp.on = True</code> changes the attribute stored on that one object, and the next read sees it.' },
]},
{ id:'files', title:'Files', intro:'<code>open(name, mode)</code> opens a file. Modes: <code>"r"</code> read (the default), <code>"w"</code> write (wipes the file first), <code>"a"</code> append (adds to the end). <code>with open(...) as f:</code> closes the file for you when the block ends. Everything read from a text file is a string.', ex:[
 { t:'fill', title:'Open and read a whole file', goal:'Open notes.txt for reading and print everything in it.', out:'buy milk\ncall Ola', files:{'notes.txt':'buy milk\ncall Ola\n'},
   teach:'<p><code>open("notes.txt", "r")</code> opens a file for reading and gives you a file object. <code>f.read()</code> returns the whole content as one string.</p><p><code>with ... as f:</code> gives the file object the name f, and closes the file automatically when the indented block ends.</p>',
   ex:['with open("hi.txt", "w") as f:\n    f.write("hello")\n\nwith open("hi.txt", "r") as f:\n    print(f.read())', 'hello'],
   code:['with ___("notes.txt", ___) as f:','    text = f.___()','print(text)'], ans:[['open'],['"r"'],['read']], extra:['file','"w"','write'],
   hints:['The built-in that opens files is named after what it does. Reading mode is one letter in quotes. The method that returns everything is the mirror of write.','open, "r", read.'],
   why:'<code>"r"</code> opens for reading. <code>"w"</code> here would wipe notes.txt before you read it.' },
 { t:'fill', title:'Write a file', goal:'Create log.txt with one line, then read it back.', out:'first line',
   teach:'<p>Mode <code>"w"</code> creates the file, or wipes it if it already exists, and opens it for writing. <code>f.write(text)</code> puts text in. It does not add a line break for you: end a line with <code>\\n</code> yourself.</p><p><code>open("log.txt")</code> without a mode reads, because <code>"r"</code> is the default.</p>',
   ex:['with open("a.txt", "w") as f:\n    f.write("one")\n\nwith open("a.txt") as f:\n    print(f.read())', 'one'],
   code:['with open("log.txt", ___) as f:','    f.___("first line\\n")','','with open("log.txt") as f:','    print(f.read().strip())'], ans:[['"w"'],['write']], extra:['"r"','read','print'],
   hints:['Writing mode is one letter. The method that puts text into the file is named after the mode.','"w", then write.'],
   why:'<code>"w"</code> + <code>f.write</code> saves the text. <code>.strip()</code> removes the trailing line break before printing.' },
 { t:'fill', title:'Append, do not wipe', goal:'Add a second line to log.txt without losing the first.', out:'one\ntwo',
   teach:'<p>Opening with <code>"w"</code> wipes the file every time. Mode <code>"a"</code> (append) keeps what is there and adds new text at the end. Use it for logs and diaries.</p>',
   ex:['with open("d.txt", "w") as f:\n    f.write("Mon\\n")\nwith open("d.txt", "a") as f:\n    f.write("Tue\\n")\nwith open("d.txt") as f:\n    print(f.read().strip())', 'Mon\nTue'],
   code:['with open("log.txt", "w") as f:','    f.write("one\\n")','with open("log.txt", ___) as f:','    f.write("two\\n")','with open("log.txt") as f:','    print(f.read().strip())'], ans:[['"a"']], extra:['"w"','"r"','"+"'],
   hints:['The output keeps "one". Which mode adds to the end instead of starting over?','"a"'],
   why:'<code>"a"</code> appends. With a second <code>"w"</code> the file would contain only <code>two</code>.' },
 { t:'fill', title:'Loop over the lines', goal:'Add up the numbers in scores.txt, one per line.', out:'42', files:{'scores.txt':'10\n25\n7\n'},
   teach:'<p>A file object can be looped over directly: <code>for line in f:</code> gives one line per round, as a string, including its line break.</p><p>Text that looks like a number is still text. <code>int(line)</code> converts it to a whole number so you can add it. <code>int()</code> ignores the line break at the end.</p>',
   ex:['with open("p.txt", "w") as f:\n    f.write("3\\n4\\n")\ntotal = 0\nwith open("p.txt") as f:\n    for line in f:\n        total += int(line)\nprint(total)', '7'],
   code:['total = 0','with open("scores.txt") as f:','    for line in ___:','        total += ___(line)','print(total)'], ans:[['f'],['int']], extra:['line','str','"scores.txt"'],
   hints:['Loop over the file object, which was given a one-letter name. Then turn each text line into a whole number.','f, then int.'],
   why:'"10" + "25" would glue text together. <code>int()</code> turns each line into a number first: 10 + 25 + 7 = 42.' },
 { t:'fill', title:'strip the line break', goal:'Greet each name without the line break ruining the output.', out:'Hi Ada!\nHi Ola!', files:{'names.txt':'Ada\nOla\n'},
   teach:'<p>Each line from a file ends with <code>\\n</code>. Print <code>f"Hi {line}!"</code> and the ! lands on the next line. <code>line.strip()</code> removes spaces and line breaks from both ends of a string.</p>',
   ex:['word = "  cat\\n"\nprint(f"[{word.strip()}]")', '[cat]'],
   code:['with open("names.txt") as f:','    for line in f:','        print(f"Hi {line.___()}!")'], ans:[['strip']], extra:['split','upper','read'],
   hints:['You want to remove the invisible line break at the end of each line.','strip'],
   why:'<code>"Ada\\n".strip()</code> is <code>"Ada"</code>, so the ! stays on the same line.' },
 { t:'fill', title:'readlines gives a list', goal:'Read all lines into a list, count them, show the first.', out:'3\nAda', files:{'names.txt':'Ada\nOla\nKari\n'},
   teach:'<p><code>f.read()</code> gives one big string. <code>f.readlines()</code> gives a list with one string per line, so you can count them with <code>len()</code> or pick one by position.</p>',
   ex:['with open("t.txt", "w") as f:\n    f.write("x\\ny\\n")\nwith open("t.txt") as f:\n    rows = f.readlines()\nprint(rows)', "['x\\n', 'y\\n']"],
   code:['with open("names.txt") as f:','    lines = f.___()','print(___(lines))','print(lines[0].strip())'], ans:[['readlines'],['len']], extra:['read','count','readline'],
   hints:['You need a list of every line, and the method name says so. Counting the items in a list uses a built-in.','readlines, then len.'],
   why:'<code>readline()</code> without the s reads only one line. <code>read()</code> gives one string, and <code>len</code> would count characters instead of lines.' },
 { t:'fill', title:'Close the file (or let with do it)', goal:'Open without with, close the file yourself, then check that it is closed.', out:'True',
   teach:'<p>An open file holds a lock on it until you close it, and text you wrote may not be saved until then. Without <code>with</code>, you must call <code>f.close()</code> yourself. <code>f.closed</code> (no brackets, an attribute) tells you True or False.</p><p>That is why <code>with</code> is the normal way: it closes for you, even if an error happens.</p>',
   ex:['with open("x.txt", "w") as f:\n    f.write("hi")\nprint(f.closed)', 'True'],
   code:['f = open("todo.txt", "w")','f.write("water plants")','f.___()','print(f.___)'], ans:[['close'],['closed']], extra:['end','exit','open'],
   hints:['Line 3 calls the method that finishes with the file. Line 4 reads the True/False attribute, the same word in past tense.','close, then closed.'],
   why:'After <code>f.close()</code> the text is saved and <code>f.closed</code> is True. The <code>with</code> block does exactly this at its end.' },
 { t:'fill', title:'encoding for æ, ø, å', goal:'Write and read a Norwegian word safely on any computer.', out:'Tønsberg',
   teach:'<p>Text in a file is stored as bytes. The encoding decides how letters like ø become bytes. <code>encoding="utf-8"</code> works for every language. Without it, Windows may pick an older encoding and ø comes back as garbage.</p><p>Pass it as a keyword argument to <code>open</code>, when writing and when reading.</p>',
   ex:['with open("hei.txt", "w", encoding="utf-8") as f:\n    f.write("blåbær")\nwith open("hei.txt", encoding="utf-8") as f:\n    print(f.read())', 'blåbær'],
   code:['with open("by.txt", "w", ___="utf-8") as f:','    f.write("Tønsberg")','with open("by.txt", encoding="utf-8") as f:','    print(f.read())'], ans:[['encoding']], extra:['charset','utf8','format'],
   hints:['The keyword is written out in full on line 3.','encoding'],
   why:'Always pass <code>encoding="utf-8"</code> for text files. It is the one encoding every system reads the same way.' },
 { t:'fill', title:'Save a dict as JSON, load it back', goal:'Store settings in a file and read them back next time the program runs.', out:'7',
   teach:'<p><code>json.dump(data, f)</code> writes a dict into an open file. <code>json.load(f)</code> reads it back into a dict.</p><p>Spot the s: <code>dumps</code> and <code>loads</code> (with s) work with strings. <code>dump</code> and <code>load</code> (no s) work with files.</p>',
   ex:['import json\nwith open("s.json", "w") as f:\n    json.dump([1, 2], f)\nwith open("s.json") as f:\n    print(json.load(f))', '[1, 2]'],
   code:['import json','settings = {"theme": "dark", "volume": 7}','with open("settings.json", "w") as f:','    json.___(settings, f)','with open("settings.json") as f:','    back = json.___(f)','print(back["volume"])'], ans:[['dump'],['load']], extra:['dumps','loads','write'],
   hints:['These calls take a file, not a string, so the names have no s at the end.','dump, then load.'],
   why:'<code>dump</code>/<code>load</code> talk to files. <code>dumps</code>/<code>loads</code> talk to strings. One letter, different job.' },
 { t:'fill', title:'File missing? Catch it', goal:'Print a friendly message when the file does not exist yet.', out:'No file yet',
   teach:'<p>Opening a file that does not exist raises <code>FileNotFoundError</code> and stops the program. Wrap the risky code in <code>try:</code>, then catch that one error with <code>except FileNotFoundError:</code> and handle it.</p>',
   ex:['try:\n    open("nope.txt")\nexcept FileNotFoundError:\n    print("missing")', 'missing'],
   code:['try:','    with open("missing.txt") as f:','        print(f.read())','___ FileNotFoundError:','    print("No file yet")'], ans:[['except']], extra:['catch','else','finally'],
   hints:['Python does not use the word catch. The keyword is in the lesson.','except'],
   why:'<code>except FileNotFoundError</code> catches only that error. Other languages say catch; Python says except.' },
 { t:'order', title:'Write, then read back', goal:'Write two lines to a file, then print them one by one.', out:'eggs\nbread',
   teach:'<p>Two separate <code>with</code> blocks: the first writes and closes, the second opens again for reading. The lines inside each block are indented once; the print inside the for loop twice.</p>',
   ex:['with open("a.txt", "w") as f:\n    f.write("x\\n")\nwith open("a.txt") as f:\n    for line in f:\n        print(line.strip())', 'x'],
   lines:[['with open("list.txt", "w") as f:',0],['f.write("eggs\\n")',1],['f.write("bread\\n")',1],['with open("list.txt") as f:',0],['for line in f:',1],['print(line.strip())',2]],
   hints:['Writing must finish before reading starts. eggs is written before bread.','Indents: 0, 1, 1, 0, 1, 2.'],
   why:'The file is closed at the end of the first block, so everything written is saved before the second block reads it.' },
 { t:'fill', title:'CSV: rows of a spreadsheet', goal:'Read back the rows you wrote to a CSV file.', out:"['name', 'age']\n['Ada', '36']",
   teach:'<p>CSV is a spreadsheet as plain text: one row per line, cells split by commas. The <code>csv</code> module handles quotes and commas for you. <code>csv.writer(f)</code> writes rows; <code>csv.reader(f)</code> gives each row back as a list.</p><p>Everything comes back as text: 36 returns as <code>\'36\'</code>. Pass <code>newline=""</code> to open when working with CSV.</p>',
   ex:['import csv\nwith open("c.csv", "w", newline="") as f:\n    csv.writer(f).writerow(["a", 1])\nwith open("c.csv", newline="") as f:\n    print(list(csv.reader(f)))', "[['a', '1']]"],
   code:['import csv','with open("people.csv", "w", newline="") as f:','    w = csv.writer(f)','    w.writerow(["name", "age"])','    w.writerow(["Ada", 36])','with open("people.csv", newline="") as f:','    for row in csv.___(f):','        print(row)'], ans:[['reader']], extra:['writer','read','load'],
   hints:['Writing used csv.writer. Reading uses its mirror.','reader'],
   why:'<code>csv.reader</code> gives one list per row. The age comes back as the text <code>\'36\'</code>, so use <code>int()</code> before doing maths with it.' },
 { t:'fill', title:'pathlib: the short way', goal:'Write and read a file in one line each.', out:'Hei verden',
   teach:'<p><code>pathlib.Path</code> is the modern way to handle files. <code>Path("x.txt").write_text(text)</code> opens, writes and closes in one call. <code>.read_text()</code> opens, reads and closes.</p>',
   ex:['from pathlib import Path\np = Path("n.txt")\np.write_text("hi")\nprint(p.exists())', 'True'],
   code:['from pathlib import Path','p = Path("hello.txt")','p.___("Hei verden")','print(p.___())'], ans:[['write_text'],['read_text']], extra:['write','read','open'],
   hints:['Both method names end in _text. One writes, one reads.','write_text, then read_text.'],
   why:'Path methods hide the open/with/close steps. Use them for small files; use <code>with open</code> when you loop line by line.' },
]},
{ id:'toolkit', title:'Print, strings & lambda', intro:'<code>print</code> takes <code>sep=</code> (what goes between values) and <code>end=</code> (what goes at the end). Strings carry methods such as <code>.strip() .split() .replace() .find()</code>. <code>int() str() float() list()</code> convert between types. <code>lambda</code> is a one-line function. <code>try / except</code> catches errors so the program keeps going.', ex:[
 { t:'fill', title:'print with sep', goal:'Print a date with dashes between the parts.', out:'2026-10-07',
   teach:'<p><code>print("a", "b")</code> puts a space between values. The keyword argument <code>sep</code> (separator) replaces that space with anything you choose.</p>',
   ex:['print("a", "b", "c", sep=" | ")', 'a | b | c'],
   code:['print("2026", "10", "07", ___="-")'], ans:[['sep']], extra:['end','join','split'],
   hints:['The keyword is short for separator.','sep'],
   why:'<code>sep="-"</code> goes between every pair of values. <code>end</code> would only change the very end of the line.' },
 { t:'fill', title:'print with end', goal:'Print the numbers on one line, then "go!" on the same line.', out:'1 2 3 go!',
   teach:'<p>Every <code>print</code> ends with a line break by default. <code>end=" "</code> ends with a space instead, so the next print continues on the same line.</p>',
   ex:['print("Loading", end="...")\nprint("done")', 'Loading...done'],
   code:['for n in [1, 2, 3]:','    print(n, ___=" ")','print("go!")'], ans:[['end']], extra:['sep','next','"\\n"'],
   hints:['You want to change what print puts after the value, at the end of the line.','end'],
   why:'<code>end=" "</code> swaps the line break for a space, so 1, 2, 3 and go! all land on one line.' },
 { t:'fill', title:'Escape characters', goal:'Put a line break inside one string, and an apostrophe inside single quotes.', out:'line one\nline two\nIt\'s fine',
   teach:'<p>A backslash gives the next character a special meaning. <code>\\n</code> is a line break, <code>\\t</code> a tab. <code>\\\'</code> puts a quote mark inside a string that uses the same quotes around it.</p>',
   ex:['print("A\\tB")\nprint("x\\ny")', 'A\tB\nx\ny'],
   code:['print("line one___line two")',"print('It___s fine')"], ans:[['\\n'],["\\'"]], extra:['/n','\\t',"'"],
   hints:['Line breaks use a backslash, not a forward slash. The apostrophe needs a backslash in front so it does not end the string.','\\n, then \\\'.'],
   why:'<code>\\n</code> becomes a line break when printed. A bare <code>\'</code> would close the string early and cause a SyntaxError.' },
 { t:'fill', title:'Convert between types', goal:'Turn text into numbers to do maths, and a number into text to join it.', out:'42\n39.8\n7 days',
   teach:'<p>Changing a value from one type to another is called casting. <code>int("41")</code> gives the whole number 41. <code>float("19.90")</code> gives the decimal 19.9. <code>str(7)</code> gives the text "7".</p><p>You need this because <code>"41" + 1</code> crashes: Python will not add text and a number.</p>',
   ex:['n = int("5")\nprint(n * 2)\nprint("Score: " + str(n))', '10\nScore: 5'],
   code:['age_text = "41"','age = ___(age_text)','print(age + 1)','price = ___("19.90")','print(price * 2)','print(___(7) + " days")'], ans:[['int'],['float'],['str']], extra:['bool','list','len'],
   hints:['41 is a whole number. 19.90 has decimals. The last line glues a number onto text, so the number must become text.','int, float, str.'],
   why:'<code>int</code> for whole numbers, <code>float</code> for decimals, <code>str</code> for text. Input from users and files is always text until you convert it.' },
 { t:'fill', title:'list() and set() from a string', goal:'Split a word into letters, then into unique letters.', out:"['b', 'a', 'n', 'a', 'n', 'a']\n['a', 'b', 'n']",
   teach:'<p><code>list("abc")</code> breaks a string into a list of single characters. <code>set("abc")</code> does the same but drops duplicates. A set has no fixed order, so wrap it in <code>sorted()</code> to print it in a predictable order.</p>',
   ex:['print(list("hey"))\nprint(sorted(set("moon")))', "['h', 'e', 'y']\n['m', 'n', 'o']"],
   code:['letters = ___("banana")','print(letters)','print(sorted(___("banana")))'], ans:[['list'],['set']], extra:['str','dict','len'],
   hints:['The first output keeps every letter in order, with repeats. The second keeps each letter once.','list, then set.'],
   why:'<code>list</code> keeps all 6 letters in order. <code>set</code> keeps only b, a, n, and <code>sorted</code> puts them in a-b-n order.' },
 { t:'fill', title:'Clean up text', goal:'Remove the outer spaces, then swap one word for another.', out:'Hello Python',
   teach:'<p><code>.strip()</code> removes spaces and line breaks from both ends. <code>.replace(old, new)</code> swaps every copy of old for new.</p><p>Strings never change in place: both methods return a new string, so you store or print the result.</p>',
   ex:['s = "  hi there  "\nprint(s.strip().replace("hi", "bye"))', 'bye there'],
   code:['raw = "  Hello World  "','clean = raw.___()','print(clean.___("World", "Python"))'], ans:[['strip'],['replace']], extra:['trim','swap','split'],
   hints:['Python calls trimming spaces strip. Swapping one piece of text for another is replace.','strip, then replace.'],
   why:'<code>trim</code> is JavaScript. In Python it is <code>strip</code>, and <code>replace</code> swaps text.' },
 { t:'fill', title:'split and join', goal:'Cut a comma line into a list, then glue it back with " + ".', out:"['apple', 'pear', 'plum']\napple + pear + plum",
   teach:'<p><code>"a,b".split(",")</code> cuts a string at every comma and gives a list: <code>[\'a\', \'b\']</code>.</p><p><code>" + ".join(items)</code> does the opposite: it glues a list of strings together, with the string before the dot between each pair. The glue comes first, which surprises most beginners.</p>',
   ex:['words = "a b c".split(" ")\nprint("-".join(words))', 'a-b-c'],
   code:['line = "apple,pear,plum"','parts = line.___(",")','print(parts)','print(" + ".___(parts))'], ans:[['split'],['join']], extra:['strip','concat','cut'],
   hints:['Cutting a string into a list is split. Gluing a list into one string is join, called on the glue.','split, then join.'],
   why:'<code>split</code> turns text into a list; <code>join</code> turns a list back into text.' },
 { t:'fill', title:'Search inside text', goal:'Find where @ sits, check how the address starts, check if a string is all digits.', out:'3\nTrue\nTrue',
   teach:'<p><code>s.find("x")</code> returns the position of the first x (counting from 0), or -1 if missing.<br><code>s.startswith("ab")</code> and <code>s.endswith("yz")</code> answer True or False.<br><code>s.isdigit()</code> is True when every character is a digit; <code>s.isalpha()</code> when every character is a letter.</p>',
   ex:['s = "hello"\nprint(s.find("l"))\nprint(s.endswith("lo"))\nprint(s.isalpha())', '2\nTrue\nTrue'],
   code:['email = "ada@example.com"','print(email.___("@"))','print(email.___("ada"))','print("2026".___())'], ans:[['find'],['startswith'],['isdigit']], extra:['index_of','begins','isnumber'],
   hints:['Position of a character: find. Checking the start: startswith. All digits: isdigit.','find, startswith, isdigit.'],
   why:'a-d-a are positions 0, 1, 2, so @ is at 3. The other two return True or False.' },
 { t:'fill', title:'Slicing text', goal:'Take the first three letters, then reverse the whole word.', out:'Pyt\nnohtyP\nn',
   teach:'<p><code>word[start:stop]</code> cuts out a piece. Stop is not included. Leave start out and it begins at 0: <code>word[:3]</code> is the first three characters.</p><p>A third number is the step. <code>word[::-1]</code> walks backwards with step -1, which reverses the string. <code>word[-1]</code> is the last character.</p>',
   ex:['s = "Bergen"\nprint(s[1:4])\nprint(s[-2:])', 'erg\nen'],
   code:['word = "Python"','print(word[___])','print(word[___])','print(word[-1])'], ans:[[':3'],['::-1']], extra:['0:2','3:','-1:'],
   hints:['First three: from the start up to (not including) 3. Reversed: step backwards through everything.',':3, then ::-1.'],
   why:'<code>[:3]</code> gives positions 0, 1, 2. <code>[::-1]</code> walks the whole string backwards.' },
 { t:'fill', title:'lambda: a function in one line', goal:'Write two tiny functions without def.', out:'42\n81',
   teach:'<p><code>lambda x: x * 2</code> is a function with no name: parameters before the colon, the result after it. No <code>return</code> needed, the expression is returned.</p><p>It is the same as <code>def double(x): return x * 2</code>, just shorter. Use it for small one-off functions.</p>',
   ex:['add = lambda a, b: a + b\nprint(add(2, 3))', '5'],
   code:['double = ___ x: x * 2','square = lambda n: n ___ 2','print(double(21))','print(square(9))'], ans:[['lambda'],['**']], extra:['def','return','^'],
   hints:['The keyword for a one-line function is in the lesson title. Power in Python is two stars, not ^.','lambda, then **.'],
   why:'A lambda returns its expression. <code>^</code> in Python is not power (it is bitwise XOR), so 9 ^ 2 would give 11.' },
 { t:'fill', title:'sorted with key=lambda', goal:'Sort people by age, youngest first.', out:"[('Kari', 29), ('Ada', 36), ('Ola', 41)]",
   teach:'<p><code>sorted(items)</code> returns a new sorted list. <code>key=</code> tells it what to sort by: a function that gets one item and returns the value to compare.</p><p>Each person here is a tuple <code>(name, age)</code>. <code>lambda p: p[1]</code> picks the age, position 1.</p>',
   ex:['words = ["kiwi", "fig", "banana"]\nprint(sorted(words, key=lambda w: len(w)))', "['fig', 'kiwi', 'banana']"],
   code:['people = [("Ola", 41), ("Kari", 29), ("Ada", 36)]','by_age = sorted(people, ___=lambda p: p[___])','print(by_age)'], ans:[['key'],['1']], extra:['by','0','sort'],
   hints:['The keyword argument that says "sort by this" is key. The age is the second item in each tuple, which is position 1.','key, then 1.'],
   why:'<code>p[0]</code> would sort by name (Ada, Kari, Ola). <code>p[1]</code> sorts by age.' },
 { t:'fill', title:'filter and map', goal:'Keep the even numbers, then square them.', out:'[2, 4, 6] [4, 16, 36]',
   teach:'<p><code>filter(test, items)</code> keeps the items where test returns True. <code>map(change, items)</code> applies change to every item. Both give a lazy result, so wrap them in <code>list()</code> to see it.</p><p>A list comprehension does the same: <code>[n * n for n in nums if n % 2 == 0]</code>.</p>',
   ex:['print(list(map(lambda s: s.upper(), ["a", "b"])))', "['A', 'B']"],
   code:['nums = [1, 2, 3, 4, 5, 6]','evens = list(___(lambda n: n % 2 == 0, nums))','squares = list(___(lambda n: n * n, evens))','print(evens, squares)'], ans:[['filter'],['map']], extra:['sorted','zip','reduce'],
   hints:['The first lambda returns True or False, so it is a test: which function keeps only items that pass? The second changes every item.','filter, then map.'],
   why:'<code>filter</code> keeps 2, 4, 6. <code>map</code> squares each one: 4, 16, 36.' },
 { t:'fill', title:'try, except, else, finally', goal:'Convert each text to a number, handle the bad one, and always print a check line.', out:'ok: 12\nchecked 12\nbad: abc\nchecked abc',
   teach:'<p><code>try:</code> runs risky code. <code>except SomeError:</code> runs only if that error happened. <code>else:</code> runs only if no error happened. <code>finally:</code> runs every time, error or not.</p><p><code>int("abc")</code> raises a <code>ValueError</code>: the type (text) is fine, the value cannot become a number.</p>',
   ex:['try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print("no dividing by zero")\nfinally:\n    print("done")', 'no dividing by zero\ndone'],
   code:['for text in ["12", "abc"]:','    ___:','        n = int(text)','    except ___:','        print("bad:", text)','    else:','        print("ok:", n)','    ___:','        print("checked", text)'], ans:[['try'],['ValueError'],['finally']], extra:['catch','TypeError','always'],
   hints:['The block opens with try. int("abc") raises a ValueError. The part that always runs is finally.','try, ValueError, finally.'],
   why:'"12" converts, so else runs. "abc" fails with ValueError, so except runs. finally runs both times. With TypeError the program would crash, because that is not the error int raises here.' },
 { t:'fill', title:'raise your own error', goal:'Refuse a negative age, then catch the error and print its message.', out:'Error: age cannot be negative',
   teach:'<p><code>raise ValueError("message")</code> stops the function with an error you choose. The caller can catch it with <code>except ValueError as e:</code>; the name <code>e</code> then holds the error, and printing it shows the message.</p>',
   ex:['def pay(amount):\n    if amount <= 0:\n        raise ValueError("must be positive")\n    return amount\n\ntry:\n    pay(0)\nexcept ValueError as e:\n    print(e)', 'must be positive'],
   code:['def set_age(age):','    if age < 0:','        ___ ValueError("age cannot be negative")','    return age','','try:','    set_age(-5)','except ValueError as e:','    print("Error:", ___)'], ans:[['raise'],['e']], extra:['throw','return','error'],
   hints:['Python does not use throw. The caught error was given a one-letter name after as.','raise, then e.'],
   why:'<code>raise</code> creates the error. <code>as e</code> catches it under the name e, and <code>print(e)</code> shows its message.' },
 { t:'order', title:'Chain string steps', goal:'Split a sentence, reverse the words, join them, shout it.', out:'SAT CAT THE',
   teach:'<p><code>.split()</code> with no argument cuts at spaces. <code>words.reverse()</code> flips the list in place and returns nothing, so it stands on its own line. Then <code>" ".join</code> glues the words back and <code>.upper()</code> capitalises.</p>',
   ex:['w = "a b".split()\nw.reverse()\nprint(w)', "['b', 'a']"],
   lines:[['words = "the cat sat".split()',0],['words.reverse()',0],['sentence = " ".join(words)',0],['print(sentence.upper())',0]],
   hints:['Each line uses the result of the line before it. The output is reversed, so the reverse step comes before the join.','split, reverse, join, print.'],
   why:'<code>reverse()</code> changes the list itself. Joining before reversing would give THE CAT SAT.' },
]},
{ id:'json', title:'Working with JSON', intro:'JSON is text that looks like Python dicts and lists. <code>json.loads</code> turns text into Python; <code>json.dumps</code> turns Python into text. The s means string. Spelling differs: JSON <code>true / false / null</code> is Python <code>True / False / None</code>.', ex:[
 { t:'fill', title:'Text to Python', goal:'Parse a JSON string into a dict, then read a field.', out:'2',
   teach:'<p>JSON is text. It looks like a Python dict but it is just characters in a string, so <code>raw["qty"]</code> would fail. <code>json.loads(raw)</code> (load string) reads the text and builds a real dict from it. After that, normal dict lookups work.</p>',
   ex:['import json\ntxt = \'{"a": 1}\'\nd = json.loads(txt)\nprint(d["a"])', '1'],
   code:['import json','raw = \'{"symbol": "MNQ", "qty": 2}\'','data = json.___(raw)','print(data[___])'], ans:[['loads'],['"qty"']], extra:['load','parse','qty'],
   hints:['load + s, because the input is a string. Then look up the key that holds 2, quotes included.','loads, then "qty".'],
